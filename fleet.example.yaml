host: macbook
defaultHost: p620
boardUrl: http://127.0.0.1:4100
matesFilter: []
workspacesRoot: ./workspaces
projectsRoot: ~/.fleet-v3/projects
concurrency: 4
leaseSeconds: 900
idleTimeoutSeconds: 1800
maxWallSeconds: 7200
maxAttempts: 3
maxReviewRounds: 4

server:
  host: 127.0.0.1
  port: 4100
  dataDir: ./board
  chaseIntervalSeconds: 120
  staleAfterSeconds: 120
  captainNagSeconds: 600

spawn:
  mode: local
  viewport: herdr
  direnv: true
  command:
    - ypi
    - --auto-exit
    - --no-session
    - --append-system-prompt
    - "{prompt}"
    - "Read card #{card} with `fleet view {card} --full` and execute it."
  herdr:
    keepPane: on-failure
  container:
    image: fleet-worker:latest
    ssh: true
    cpus: 4
    memory: 8G
    inheritEnv:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GH_TOKEN
    mounts:
      - ~/.pi/agent/auth.json:/root/.pi/agent/auth.json:ro
      - ~/.pi/agent/tiers.json:/root/.pi/agent/tiers.json:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    extraArgs: []

mates:
  stateDir: ./mates
  command:
    - ypi
    - -e
    - "{adapter}"
    - --append-system-prompt
    - "{prompt}"
  env:
    YPI_OPTCHAT_CONFIG: "{stateDir}/optchat.json"
  items:
    - name: 1stmate
      parent: captain
      workspace: 1stmate
      cwd: ./1stmate
      autoStart: false
    - name: example
      parent: 1stmate
      cwd: ~/Projects/example-app
      autoStart: true
    - name: support-bot
      parent: 1stmate
      mode: external

repos:
  example-app:
    remote: git@github.com:example/example-app.git
    delivery: no-mistakes
    yolo: false
