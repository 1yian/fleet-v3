host: macbook
boardUrl: http://127.0.0.1:4100
matesFilter: []
workspacesRoot: ~/fleet-workspaces
concurrency: 4
leaseSeconds: 900
idleTimeoutSeconds: 1800
maxWallSeconds: 7200
maxAttempts: 3
maxReviewRounds: 4

server:
  host: 127.0.0.1
  port: 4100
  dataDir: ~/.fleet-v3/board
  chaseIntervalSeconds: 120
  staleAfterSeconds: 120

spawn:
  mode: local
  viewport: herdr
  direnv: true
  command:
    - ypi
    - --auto-exit
    - --no-session
    - --append-system-prompt
    - "{prompt}"
    - "Read card #{card} with `fleet view {card} --full` and execute it."
  herdr:
    workspace: workers
    keepPane: on-failure
  container:
    image: fleet-worker:latest
    ssh: true
    cpus: 4
    memory: 8G
    inheritEnv:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GH_TOKEN
    mounts:
      - ~/.pi/agent/auth.json:/root/.pi/agent/auth.json:ro
      - ~/.pi/agent/tiers.json:/root/.pi/agent/tiers.json:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    extraArgs: []

mates:
  workspace: mates
  stateDir: ~/.fleet-v3/mates
  command:
    - ypi
    - --model
    - tier/orchestrator
    - -e
    - "{adapter}"
    - --append-system-prompt
    - "{prompt}"
  env:
    YPI_OPTCHAT_CONFIG: "{stateDir}/optchat.json"
  items:
    - name: jarvis
      parent: captain
      workspace: jarvis
      cwd: ~/.fleet-v3
      autoStart: true
    - name: example
      parent: jarvis
      cwd: ~/fleet-workspaces/personal/example-app/main
      autoStart: true

repos:
  example-app:
    path: ~/fleet-workspaces/personal/example-app/main
    baseBranch: main
    delivery: no-mistakes
